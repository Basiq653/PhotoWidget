name: PhotoWidget
options:
  bundleIdPrefix: com.photowidget
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "NO"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    DEAD_CODE_STRIPPING: "YES"

targets:
  PhotoWidget:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: PhotoWidgetExt
        embed: true
    settings:
      base:
        PRODUCT_NAME: PhotoWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.photowidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleDisplayName: "Фото-виджет"
        CFBundleName: "PhotoWidget"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.photowidget
            CFBundleURLSchemes:
              - photowidget

  PhotoWidgetExt:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: PhotoWidgetExt
        PRODUCT_BUNDLE_IDENTIFIER: com.photowidget.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
    info:
      path: Support/Ext-Info.plist
      properties:
        CFBundleDisplayName: "Фото"
        CFBundleName: "PhotoWidgetExt"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  PhotoWidget:
    build:
      targets:
        PhotoWidget: all
    run:
      config: Release
    archive:
      config: Release
